[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-password-manager"
version = "0.1.0"
description = "An educational password manager for learning encryption and vault storage."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8.0"]
